apiVersion: ci.concourse.crossplane.io/v1alpha1
kind: Pipeline
metadata:
  name: hello-world
spec:
  forProvider:
    teamName: my-team
    pipelineName: hello-world
    config:
      inline: |
        jobs:
          - name: hello
            plan:
              - task: say-hello
                config:
                  platform: linux
                  image_resource:
                    type: registry-image
                    source:
                      repository: alpine
                  run:
                    path: echo
                    args: ["Hello, Crossplane!"]
  providerConfigRef:
    name: default
