name: CI

on:
  push:
    branches: [main, crossplane-rewrite]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  detect-noop:
    runs-on: ubuntu-latest
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@v5.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.png", "**.jpg"]'
          do_not_skip: '["workflow_dispatch", "push"]'

  lint:
    runs-on: ubuntu-latest
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.2

  unit-tests:
    runs-on: ubuntu-latest
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Unit Tests
        run: go test ./... -v -coverprofile=coverage.txt -covermode=atomic

      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.txt
          flags: unittests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  check-diff:
    runs-on: ubuntu-latest
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate CRDs
        run: go run sigs.k8s.io/controller-tools/cmd/controller-gen@latest crd paths="./apis/..." output:crd:dir=package/crds

      - name: Generate DeepCopy
        run: go run sigs.k8s.io/controller-tools/cmd/controller-gen@latest object:headerFile=hack/boilerplate.go.txt paths="./apis/..."

      - name: Generate Managed Resource Methods
        run: go run github.com/crossplane/crossplane-tools/cmd/angryjet@v0.0.0-20251017183449-dd4517244339 generate-methodsets --header-file=hack/boilerplate.go.txt ./apis/...

      - name: Check Diff
        run: |
          git diff --exit-code || (echo "Generated files are out of date. Run 'make generate' and commit the results." && exit 1)

  build:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, check-diff]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Binary
        run: CGO_ENABLED=0 go build -o _output/provider-concourse ./cmd/provider/

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: provider-concourse:latest

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: provider-binary
          path: _output/provider-concourse
