name: CI

on:
  push:
    branches: [main, crossplane-rewrite]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Verify CRDs
        run: |
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@latest crd paths="./apis/..." output:crd:dir=package/crds
          git diff --exit-code package/crds/
